<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTS Digital Solutions - Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.box{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input type="text" id="user" placeholder="Admin ID">

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

var username=document.getElementById("user").value;

var password=document.getElementById("pass").value;

if(username=="admin" && password=="12345"){

window.location.href="admin.html";

}else{

alert("गलत ID या Password");

}

}

</script>

</body>
</html>
